
{% extends "base.html" %}

{% block title %}新增文章{% endblock %}

{% block content %}
    <h1>新增文章</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('new_post') }}">
        <label for="title">文章標題</label>
        <input
            type="text"
            id="title"
            name="title"
            required
        >

        <label for="author">作者</label>
        <input
            type="text"
            id="author"
            name="author"
            required
        >

        <label for="content">文章內容</label>
        <textarea
            id="content"
            name="content"
            rows="10"
            required
        ></textarea>

        <button type="submit">發表文章</button>
    </form>
{% endblock %}
