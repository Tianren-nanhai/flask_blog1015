
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>我的部落格</title>
</head>
<body>
    <h1>我的部落格</h1>

    {% for post in posts %}
        <article>
            <h2>
                <a href="{{ url_for('show_post', post_id=post.id) }}">
                    {{ post.title }}
                </a>
            </h2>

            <p>作者：{{ post.author }}</p>
            <p>{{ post.content }}</p>
            <hr>
        </article>
    {% else %}
        <p>目前沒有文章。</p>
    {% endfor %}

    <p><a href="{{ url_for('new_post') }}">新增文章</a></p>
</body>
</html>
